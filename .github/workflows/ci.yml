name: Native runtime and browser
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev g++
      - run: bash scripts/setup.sh
      - run: .venv/bin/python -m pytest -q
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke and accessibility
        run: |
          .venv/bin/python -m relive serve > /tmp/relive.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:7331/api/state > /dev/null && break; sleep 1; done
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright/
